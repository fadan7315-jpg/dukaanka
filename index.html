<!DOCTYPE html>
<html lang="so"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#483D8B"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Dukaanka – Maamulka</title>
<style>
:root{--bg:#f4f3fa;--card:#fff;--ink:#1d1a33;--mut:#6b6788;--pri:#483D8B;--acc:#eeedf8;--line:#d6d3ea;--ok:#1e6b34;--okb:#d4edda;--wa:#8a4b00;--wab:#ffe5b4;--bad:#9c1c28;--badb:#f8d7da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141222;--card:#201d35;--ink:#ece9fb;--mut:#a29ec4;--acc:#2b2748;--line:#3a3560;--ok:#7fd69a;--okb:#1d3a28;--wa:#ffc27a;--wab:#44311a;--bad:#ff9aa5;--badb:#45202a}}
:root[data-theme="dark"]{--bg:#141222;--card:#201d35;--ink:#ece9fb;--mut:#a29ec4;--acc:#2b2748;--line:#3a3560;--ok:#7fd69a;--okb:#1d3a28;--wa:#ffc27a;--wab:#44311a;--bad:#ff9aa5;--badb:#45202a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
header{background:#483D8B;color:#fff;padding:14px 16px;font-weight:700;font-size:18px;text-align:center}
main{padding:12px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#483D8B;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:#cfcaf2;padding:9px 2px;font-size:11px}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:#fff;background:#2f2766}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.kpi{background:var(--acc);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;text-align:center}
.kpi h4{margin:0;background:#483D8B;color:#fff;font-size:12px;padding:7px}
.kpi div{font-size:26px;font-weight:700;padding:10px}
h3{margin:0 0 8px;font-size:15px;color:var(--pri)}
@media (prefers-color-scheme:dark){h3{color:#b9b0f5}}
input,select,textarea{width:100%;padding:11px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.r2{display:flex;gap:8px}.r2>*{flex:1;min-width:0}
.btn{background:#483D8B;color:#fff;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;width:100%;margin-top:6px}
.btn.s{background:var(--acc);color:var(--pri);width:auto;padding:7px 12px;font-size:13px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.row small{color:var(--mut);display:block}
.chip{border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;border:0}
.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.bad{background:var(--badb);color:var(--bad)}
.alert{background:var(--wab);color:var(--wa);border-radius:10px;padding:10px;margin-bottom:12px;font-weight:700}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}.seg .on{background:#483D8B;color:#fff}
.tot{display:flex;justify-content:space-between;padding:8px 0;font-weight:700}
.inv{background:#fff;color:#111;border:1px solid var(--line)}
.inv .hd{background:#483D8B;color:#fff;text-align:center;padding:10px;border-radius:8px}
.inv .row{border-color:#ddd}.inv .row small{color:#555}
.po{display:none}@media print{.po{display:inline!important}body>*:not(main),.noprint{display:none!important}body{background:#fff}}
</style></head><body>
<header>Dukaanka – Maamulka</header>
<main id="v"></main><nav id="nav"></nav>
<script>
const LK="dukaan_v1",T=[["dash","📊","Kooban"],["sales","🛒","Iib"],["stock","📦","Keyd"],["exp","💸","Qarash"],["inv","🧾","Invoice"]];
let S={sales:[],stock:[],exp:[],debts:[],shop:"MAGACA DUKAANKA",lim:5,no:1},tab="dash",sub="exp",pend="",doc=null,tm,
 inv={c:"",t:"",it:[],paid:0};
const $=s=>document.querySelector(s),v=id=>$("#"+id).value,n=id=>parseFloat(v(id))||0;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $$=x=>(x<0?"-":"")+"$"+Math.abs(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0),today=()=>new Date().toISOString().slice(0,10),fd=d=>(d||"").split("-").reverse().join("/");
const sold=m=>sum(S.sales.filter(x=>x.item.toLowerCase()===m.toLowerCase()),x=>x.q),rest=i=>i.in-sold(i.item);
const CATS=["Kiro","Koronto","Dhaqaale/Shaqaale","Transport","Wixii kale"];
function save(){S.t=Date.now();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(push,800)}
function load(){try{const j=localStorage.getItem(LK);if(j)Object.assign(S,JSON.parse(j))}catch(e){}}
function del(k,i){const p=k+i;if(pend===p){S[k].splice(i,1);pend="";save()}else pend=p;render()}
const dbtn=(k,i)=>`<button class="btn s" onclick="del('${k}',${i})">${pend===k+i?"Hubi?":"✕"}</button>`;
function go(t){tab=t;pend="";render();scrollTo(0,0)}
function addSale(){const item=v("si").trim(),q=n("sq");if(!item||q<=0)return;
 S.sales.push({d:v("sd")||today(),item,q,c:n("sc"),p:n("sp")});
 if(!S.stock.some(x=>x.item.toLowerCase()===item.toLowerCase()))S.stock.push({item,in:0});save();render()}
function fill(){const l=[...S.sales].reverse().find(x=>x.item.toLowerCase()===v("si").trim().toLowerCase());if(l){if(!v("sc"))$("#sc").value=l.c;if(!v("sp"))$("#sp").value=l.p}}
function addStock(){const item=v("ki").trim(),q=n("kq");if(!item)return;const f=S.stock.find(x=>x.item.toLowerCase()===item.toLowerCase());
 f?f.in+=q:S.stock.push({item,in:q});save();render()}
function addExp(){const a=n("ea");if(a<=0)return;S.exp.push({d:v("ed")||today(),cat:v("ec"),note:v("en"),a});save();render()}
function addDebt(){const a=n("da"),nm=v("dn").trim();if(a<=0||!nm)return;S.debts.push({d:v("dd")||today(),nm,tel:v("dt"),a,paid:false});save();render()}
function addInv(){const it=v("ii").trim(),q=n("iq"),p=n("ip");if(!it||q<=0)return;inv.c=v("ic");inv.t=v("it");inv.it.push({it,q,p});render()}
function newInv(){inv={c:"",t:"",it:[],paid:0};S.no++;save();render()}
function dlBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="dukaan-backup-"+today()+".json";a.click();S.bk=today();save();render()}
function sendBackup(){const f=new File([JSON.stringify(S)],"dukaan-backup-"+today()+".txt",{type:"text/plain"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Dukaanka Backup"}).then(()=>{S.bk=today();save();render()}).catch(()=>{})}else dlBackup()}
function rf(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#bk").value=r.result;restore()};r.readAsText(f)}
const FBC={apiKey:"AIzaSyBPUUlqzfCLVpU9E1hHD3pXvvbJtePcqFI",authDomain:"dukaanka-e8018.firebaseapp.com",projectId:"dukaanka-e8018",storageBucket:"dukaanka-e8018.firebasestorage.app",messagingSenderId:"408649877811",appId:"1:408649877811:web:3b2713fcc246463d595646"};
let FB=null,CU=null,CS="";
const setCS=t=>{CS=t;const e=$("#cs");if(e)e.textContent=t};
const errM=e=>({"auth/invalid-credential":"Email ama password waa khalad","auth/invalid-email":"Email-ku ma saxna","auth/email-already-in-use":"Email-kan horey ayaa loo isticmaalay, riix Gal","auth/weak-password":"Password-ku waa inuu ahaado 6 xaraf ama ka badan","auth/network-request-failed":"Internet ma jiro","auth/popup-closed-by-user":"Daaqadda waa la xidhay, mar kale isku day","auth/popup-blocked":"Browser-ka ayaa xiray daaqadda, ogolow popup","auth/unauthorized-domain":"Domain-kan Firebase ma ogola","auth/operation-not-allowed":"Google login ma daarna Firebase"}[e.code]||("Khalad: "+(e.code||e.message)));
function cfgParse(t){const o={};["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{const m=t.match(new RegExp(k+"\\s*:\\s*[\"']([^\"']+)"));if(m)o[k]=m[1]});return o.apiKey&&o.projectId?o:null}
async function fbInit(){if(FB)return FB;const c=FBC;const B="https://www.gstatic.com/firebasejs/10.12.2/";
 const [a,au,fs]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
 const app=a.initializeApp(c);FB={au,fs,auth:au.getAuth(app),db:fs.getFirestore(app)};
 au.onAuthStateChanged(FB.auth,u=>{CU=u;render();if(u)pull()});return FB}
async function push(){if(!FB||!CU||!navigator.onLine)return;try{await FB.fs.setDoc(FB.fs.doc(FB.db,"users",CU.uid),{json:JSON.stringify(S),t:S.t||Date.now()});setCS("✓ Cloud sync: "+new Date().toLocaleTimeString())}catch(e){setCS(errM(e))}}
async function pull(){try{setCS("Sync...");const r=await FB.fs.getDoc(FB.fs.doc(FB.db,"users",CU.uid));
 if(r.exists()&&(r.data().t||0)>(S.t||0)){S=Object.assign({sales:[],stock:[],exp:[],debts:[],shop:"MAGACA DUKAANKA",lim:5,no:1},JSON.parse(r.data().json));try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}render();setCS("✓ Xogta cloud waa la soo qaaday")}else await push()}catch(e){setCS(errM(e))}}
const au_=f=>async()=>{if(!FB)return setCS("Cloud ma diyaarsana (internet?)");try{await FB.au[f](FB.auth,v("fe").trim(),v("fp"))}catch(e){setCS(errM(e))}};
const signup=au_("createUserWithEmailAndPassword"),signin=au_("signInWithEmailAndPassword");
async function signG(){if(!FB)return setCS("Internet ma jiro, mar kale isku day");try{await FB.au.signInWithPopup(FB.auth,new FB.au.GoogleAuthProvider())}catch(e){setCS(errM(e))}}
function signout(){FB.au.signOut(FB.auth)}
function saveCfg(){const c=cfgParse(v("fc"));if(!c){CS="Config ma saxna (waa inuu ku jiraa apiKey iyo projectId)";render();return}localStorage.setItem("dukaan_fbcfg",JSON.stringify(c));FB=null;CS="";fbInit().then(()=>render()).catch(e=>setCS("Khalad: "+e.message));render()}
function resetCfg(){localStorage.removeItem("dukaan_fbcfg");location.reload()}
function backup(){$("#bk").value=JSON.stringify(S)}
function restore(){try{const j=JSON.parse(v("bk"));if(!j||!Array.isArray(j.sales))throw 0;S=Object.assign({sales:[],stock:[],exp:[],debts:[],shop:"MAGACA DUKAANKA",lim:5,no:1},j);save();render()}catch(e){$("#bk").value="Khalad: backup-ka ma saxna."}}
const dl=()=>`<datalist id="dl">${S.stock.map(x=>`<option value="${esc(x.item)}">`).join("")}</datalist>`;
const V={
dash(){const tot=sum(S.sales,x=>x.p*x.q),gp=sum(S.sales,x=>(x.p-x.c)*x.q),ex=sum(S.exp,x=>x.a),un=sum(S.debts.filter(x=>!x.paid),x=>x.a),low=S.stock.filter(i=>rest(i)<S.lim);
 const K=(h,x,c)=>`<div class="kpi"><h4>${h}</h4><div style="${c||""}">${$$(x)}</div></div>`,net=gp-ex;
 return ((S.sales.length||S.exp.length)&&(!S.bk||(Date.now()-new Date(S.bk))/864e5>7)?`<div class="alert">💾 Backup samee: dir faylka WhatsApp ama Drive (tab-ka Kooban, hoos).</div>`:"")+(low.length?`<div class="alert">⚠ DIGNIIN: ${low.length} alaab ayaa ka yar ${S.lim} xabo — fur “Keyd”.</div>`:"")+
 K("WADARTA IIBKA GUUD (Total Sales)",tot)+K("FAAIIDADA ZAIIDKA AH (Gross Profit)",gp)+K("WADARTA QARASHKA (Total Expenses)",ex)+
 K("FAAIIDADA SAFIGA AH (Net Profit)",net,"color:var("+(net<0?"--bad":"--ok")+")")+K("DEYNTA KA MAQAN (Unpaid Debts)",un)+
 `<div class="card"><h3>Qarashka qaybaha ahaan</h3>${CATS.map(c=>`<div class="row"><span>${c}</span><b>${$$(sum(S.exp.filter(x=>x.cat===c),x=>x.a))}</b></div>`).join("")}</div>
 ${V.cloud()}
 <div class="card"><h3>Backup (ka ilaali xogta)</h3><small>“Samee Backup” → koobiyee qoraalka oo ku keydi Notes/WhatsApp. Soo celinta: ku dheji, riix “Soo celi”.</small>
 <textarea id="bk" rows="3"></textarea><div class="r2"><button class="btn" onclick="backup()">Samee Backup</button><button class="btn" onclick="restore()">Soo celi</button></div><small>Backup ugu dambeeyay: <b>${S.bk?fd(S.bk):"weli ma jiro"}</b></small><button class="btn" onclick="sendBackup()">📤 Dir Backup (WhatsApp / Drive)</button><button class="btn" onclick="dlBackup()">Soo deji Backup (fayl)</button><label style="display:block;margin-top:8px;font-size:13px">Soo celi fayl:</label><input type="file" accept=".json,.txt" onchange="rf(this)"></div>`},
cloud(){const st=`<small id="cs">${esc(CS)}</small>`;
 if(!CU)return `<div class="card"><h3>☁ Cloud Backup</h3><small>Gal Gmail-kaaga si xogtaadu u badbaado oo taleefan kasta kuugu soo noqoto.</small><button class="btn" onclick="signG()">Gal Google</button>${st}</div>`;
 return `<div class="card"><h3>☁ Cloud Backup</h3><div>Gashay: <b>${esc(CU.email)}</b></div><div class="r2"><button class="btn" onclick="push()">Sync hadda</button><button class="btn" onclick="signout()">Ka bax</button></div>${st}</div>`},
sales(){return dl()+`<div class="card"><h3>Iib cusub</h3><input id="si" list="dl" placeholder="Magaca alaabta" oninput="fill()"><div class="r2"><input id="sq" type="number" inputmode="decimal" placeholder="Tirada"><input id="sd" type="date" value="${today()}"></div>
 <div class="r2"><input id="sc" type="number" inputmode="decimal" placeholder="Qiimaha soo iibka $"><input id="sp" type="number" inputmode="decimal" placeholder="Qiimaha iibka $"></div><button class="btn" onclick="addSale()">+ Ku dar Iibka</button></div>
 <div class="card"><h3>Iibyada (${S.sales.length}) — ${$$(sum(S.sales,x=>x.p*x.q))}</h3>${[...S.sales.keys()].reverse().map(i=>{const x=S.sales[i];return `<div class="row"><div><b>${esc(x.item)}</b> × ${x.q}<small>${fd(x.d)} · Iib ${$$(x.p*x.q)} · Faaiido ${$$((x.p-x.c)*x.q)}</small></div>${dbtn("sales",i)}</div>`}).join("")||"<small>Weli iib ma jiro.</small>"}</div>`},
stock(){return `<div class="card"><h3>Alaab soo gashay</h3><input id="ki" placeholder="Magaca alaabta (tus. Bariis)"><input id="kq" type="number" inputmode="decimal" placeholder="Tirada soo gashay"><button class="btn" onclick="addStock()">+ Ku dar Keydka</button>
 <small>Haddii magacu jiro, tirada waa lagu darayaa.</small><label style="display:block;margin-top:8px">Xadka digniinta (ka yar):</label><input type="number" inputmode="numeric" value="${S.lim}" onchange="S.lim=parseFloat(this.value)||0;save();render()"></div>
 <div class="card"><h3>Keydka</h3>${S.stock.map((x,i)=>{const r=rest(x),c=r<=0?"bad":r<S.lim?"wa":"ok",t=r<=0?"DHAMMAATAY":r<S.lim?"DIGNIIN":"Wanaagsan";
 return `<div class="row"><div><b>${esc(x.item)}</b><small>Soo gashay ${x.in} · Baxday ${sold(x.item)} · Hartay <b>${r}</b></small></div><span class="chip ${c}">${t}</span>${dbtn("stock",i)}</div>`}).join("")||"<small>Keydku waa madhan yahay.</small>"}</div>`},
exp(){const seg=`<div class="seg"><button class="${sub=="exp"?"on":""}" onclick="sub='exp';render()">Qarashka</button><button class="${sub=="debt"?"on":""}" onclick="sub='debt';render()">Deynta</button></div>`;
 if(sub=="exp")return seg+`<div class="card"><h3>Qarash cusub</h3><select id="ec">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="en" placeholder="Faahfaahin"><div class="r2"><input id="ea" type="number" inputmode="decimal" placeholder="Qadarka $"><input id="ed" type="date" value="${today()}"></div><button class="btn" onclick="addExp()">+ Ku dar</button></div>
 <div class="card"><h3>Qarashada — ${$$(sum(S.exp,x=>x.a))}</h3>${[...S.exp.keys()].reverse().map(i=>{const x=S.exp[i];return `<div class="row"><div><b>${esc(x.cat)}</b> ${$$(x.a)}<small>${fd(x.d)} · ${esc(x.note)}</small></div>${dbtn("exp",i)}</div>`}).join("")||"<small>Qarash ma jiro.</small>"}</div>`;
 return seg+`<div class="card"><h3>Deyn cusub</h3><input id="dn" placeholder="Magaca macmiilka"><input id="dt" type="tel" placeholder="Nambarka Tel-ka"><div class="r2"><input id="da" type="number" inputmode="decimal" placeholder="Qadarka $"><input id="dd" type="date" value="${today()}"></div><button class="btn" onclick="addDebt()">+ Ku dar</button></div>
 <div class="card"><h3>Deymaha — Ma bixin ${$$(sum(S.debts.filter(x=>!x.paid),x=>x.a))}</h3>${[...S.debts.keys()].reverse().map(i=>{const x=S.debts[i];return `<div class="row"><div><b>${esc(x.nm)}</b> ${$$(x.a)}<small>${fd(x.d)} · ${esc(x.tel)}</small></div><button class="chip ${x.paid?"ok":"bad"}" onclick="S.debts[${i}].paid=!S.debts[${i}].paid;save();render()">${x.paid?"Wa bixiyay":"Ma bixin"}</button>${dbtn("debts",i)}</div>`}).join("")||"<small>Deyn ma jirto.</small>"}</div>`},
inv(){const T=sum(inv.it,x=>x.q*x.p);return `<div class="card noprint"><h3>Invoice cusub</h3><input value="${esc(S.shop)}" placeholder="Magaca dukaanka" onchange="S.shop=this.value;save();render()"><input id="ic" value="${esc(inv.c)}" placeholder="Magaca macmiilka"><input id="it" value="${esc(inv.t)}" placeholder="Tel-ka macmiilka">
 <input id="ii" list="dl" placeholder="Alaabta"><div class="r2"><input id="iq" type="number" inputmode="decimal" placeholder="Tirada"><input id="ip" type="number" inputmode="decimal" placeholder="Qiimaha $"></div>${dl()}<button class="btn" onclick="addInv()">+ Ku dar alaabta</button></div>
 <div class="card inv"><div class="hd"><b style="font-size:18px">${esc(S.shop)}</b><br>QAANSHEEGTA (INVOICE) · INV-${String(S.no).padStart(4,"0")}</div><p>Taariikh: ${fd(today())}<br>Macmiil: <b>${esc(inv.c)||"—"}</b> ${esc(inv.t)}</p>
 ${inv.it.map((x,i)=>`<div class="row"><div><b>${esc(x.it)}</b><small>${x.q} × ${$$(x.p)}</small></div><b>${$$(x.q*x.p)}</b><span class="noprint"><button class="btn s" onclick="inv.it.splice(${i},1);render()">✕</button></span></div>`).join("")}
 <div class="tot" style="background:#483D8B;color:#fff;padding:10px;border-radius:8px;margin-top:8px"><span>WADARTA GUUD</span><span>${$$(T)}</span></div>
 <div class="tot"><span>Lacagta la bixiyay</span><span><input class="noprint" style="width:110px;color:#111" type="number" inputmode="decimal" value="${inv.paid||""}" onchange="inv.paid=parseFloat(this.value)||0;render()"><span class="po">${$$(inv.paid)}</span></span></div>
 <div class="tot"><span>HARAAGA</span><span>${$$(T-inv.paid)}</span></div><p style="text-align:center">Mahadsanid!</p></div>
 <div class="noprint r2"><button class="btn" onclick="try{print()}catch(e){}">Daabac / PDF</button><button class="btn" onclick="newInv()">Invoice cusub</button></div>
 <p class="noprint" style="color:var(--mut);font-size:13px">Haddii “Daabac” shaqayn waayo, qaado shaashadda (screenshot) oo WhatsApp ku dir.</p>`}};
function render(){$("#v").innerHTML=V[tab]();$("#nav").innerHTML=T.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("")}
load();render();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));fbInit().catch(()=>{});addEventListener("online",()=>{FB?push():fbInit().catch(()=>{})});
</script></body></html>
