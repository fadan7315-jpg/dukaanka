const cfg={apiKey:"AIzaSyBPUUlqzfCLVpU9E1hHD3pXvvbJtePcqFI",authDomain:"dukaanka-e8018.firebaseapp.com",projectId:"dukaanka-e8018",storageBucket:"dukaanka-e8018.firebasestorage.app",messagingSenderId:"408649877811",appId:"1:408649877811:web:3b2713fcc246463d595646"};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb);

async function loadShop(id){CUR=id;INV={c:"",t:"",it:[]};CART=[];RC=null;DM=null;CF={n:"",t:"",pay:"Cash",paid:"",dc:""};localStorage.setItem("dkc_"+U.uid,id);
try{S={...empty(),...JSON.parse(localStorage.getItem(kk(id,"dk_"))||"{}")}}catch(e){S=empty()}

if(d.exists()&&d.data().json){const x=d.data();if((x.t||0)>lt){S={...empty(),...JSON.parse(x.json)};localStorage.setItem(kk(id,"dk_"),x.json);localStorage.setItem(kk(id,"dkt_"),x.t)}else if(lt>(x.t||0))save();else setSt("☁ Waa la isku waafajiyay")}
else if(lt)save();else setSt("Dukaan cusub")}catch(e){setSt("⚠ Internet ma jiro")}
if(CUR!==id)return;const s=SH.find(x=>x.id===id);if(s&&!s.name&&S.shop){s.name=S.shop;saveMeta()}
render();ingest()}
let SUB={end:0,paid:false,unk:true};
const act=()=>SUB.unk||SUB.end>Date.now(),left=()=>Math.max(0,Math.ceil((SUB.end-Date.now())/864e5));
async function loadSub(){const k="dks_"+U.uid;
try{const r=doc(db,"subs",U.uid);let d=await getDoc(r);
if(!d.exists()){await setDoc(r,{start:serverTimestamp()});d=await getDoc(r)}
const x=d.data(),s=x.start&&x.start.toMillis?x.start.toMillis():Date.now(),p=x.paidUntil&&x.paidUntil.toMillis?x.paidUntil.toMillis():0;
SUB={end:Math.max(s+864e6,p),paid:p>Date.now(),unk:false};localStorage.setItem(k,JSON.stringify(SUB))}
catch(e){let c=null;try{c=JSON.parse(localStorage.getItem(k))}catch(_){}SUB=c?{...c,unk:false}:{end:0,paid:false,unk:true}}
render()}
const bn=()=>{if(SUB.unk)return"";
if(!act())return`<div class="card" style="border:2px solid var(--bad)"><h3 style="color:var(--bad)">Waqtigaagii bilaashka ah wuu dhammaaday</h3><p style="margin:0 0 8px">Xogtaada way ammaan tahay oo waad arki kartaa. Si aad xog cusub u keydiso, bixi <b>$7 bishii</b>.</p><div class="row"><span>Lambarka lacagta</span><b>618598555</b></div><button onclick="A.pay()">Ku soo wac WhatsApp</button><button class="g" onclick="A.chk()">Waan bixiyay, hubi</button></div>`;
const d=left();if(SUB.paid&&d>5)return"";
return`<div class="alert" style="background:var(--soft);color:var(--ink)">${SUB.paid?"Akoonka waa la bixiyay · "+d+" maalmood ayaa hartay":"Tijaabo bilaash · "+d+" maalmood ayaa hartay"}</div>`};
const catItems=()=>{const mp=new Map();S.sales.forEach(x=>mp.set(x.item.toLowerCase(),{n:x.item,p:Math.round(x.p*100)/100}));S.stock.forEach(x=>{if(!mp.has(x.item.toLowerCase()))mp.set(x.item.toLowerCase(),{n:x.item,p:0})});return[...mp.values()].slice(0,400)};
const pub=id=>{if(!U||CASH||CUR!==id)return;setDoc(doc(db,"users",U.uid,"pub",id),{shop:S.shop||"",items:catItems(),t:Date.now()}).catch(()=>{})};
async function saveNow(){const id=CUR,t=Date.now(),js=JSON.stringify(S);localStorage.setItem(kk(id,"dk_"),js);localStorage.setItem(kk(id,"dkt_"),t);await setDoc(sref(id),{json:js,t},{merge:true})}
const lastC=nm=>{const l=[...S.sales].reverse().find(x=>x.item.toLowerCase()===nm.toLowerCase());return l?l.c:0};
function applyEntry(e){const f=e.sub>0?e.tot/e.sub:1,d=String(e.d).slice(0,10),cs=e.it.map(x=>lastC(x.item));
e.it.forEach((x,i)=>{S.sales.push({d,item:x.item,q:x.q,c:cs[i],p:Math.round(x.p*f*10000)/10000,cr:e.rem>0?1:0,by:e.cn||""});if(!S.stock.some(s=>s.item.toLowerCase()===x.item.toLowerCase()))S.stock.push({item:x.item,in:0})});
if(e.rem>0){const gp=e.it.reduce((t,x,i)=>t+(x.p*f-cs[i])*x.q,0);S.debts.push({d,nm:e.cust||"",tel:e.tel||"",a:e.rem,pf:e.tot>0?Math.round(gp*e.rem/e.tot*100)/100:0,paid:false})}
S.rcs=[{no:e.no,d:e.d,cust:e.cust,tel:e.tel,it:e.it,sub:e.sub,disc:e.disc,tot:e.tot,pd:e.pd,rem:e.rem,pay:e.pay,by:e.cn},...(S.rcs||[])].slice(0,200)}
let ingBusy=false;
async function ingest(){if(!U||CASH||ingBusy)return;ingBusy=true;const id=CUR;try{
const sn=await getDocs(query(collection(db,"users",U.uid,"cq"),where("shop","==",id),where("proc","==",false)));
if(CUR!==id||sn.empty)return;
const L=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.d)<String(b.d)?-1:1);
S.ing=S.ing||[];let n=0;for(const e of L){if(S.ing.includes(e.id))continue;applyEntry(e);S.ing.push(e.id);n++}
S.ing=S.ing.slice(-500);
if(n){flush();await saveNow();render()}
for(const e of L)updateDoc(doc(db,"users",U.uid,"cq",e.id),{proc:true}).catch(()=>{});
}catch(e){}finally{ingBusy=false}}
const obKey=()=>"dkob_"+U.uid;
const obGet=()=>{try{return JSON.parse(localStorage.getItem(obKey()))||[]}catch(e){return[]}};
function rebuildCash(){const all=[...OWN,...obGet().map(o=>({id:o.id,...o.e}))];all.sort((a,b)=>String(a.d)<String(b.d)?1:-1);const seen=new Set(),L=all.filter(e=>{if(seen.has(e.id))return false;seen.add(e.id);return true});

S.sales=[];L.slice().reverse().forEach(e=>e.it.forEach(x=>S.sales.push({d:String(e.d).slice(0,10),item:x.item,q:x.q,c:0,p:x.p*(e.sub>0?e.tot/e.sub:1)})))}
async function loadOwn(){try{const sn=await getDocs(query(collection(db,"users",CASH.owner,"cq"),where("by","==",U.uid)));OWN=sn.docs.map(d=>({id:d.id,...d.data()}));localStorage.setItem("dkown_"+U.uid,JSON.stringify(OWN.slice(0,150)))}catch(e){try{OWN=JSON.parse(localStorage.getItem("dkown_"+U.uid))||[]}catch(_){OWN=[]}}rebuildCash()}

async function cashInit(c){CASH={...c,uid:U.uid};CM=true;tab="sales";S={...empty(),shop:c.shopName||""};SH=[{id:"main",name:""}];CAT=[];CART=[];RC=null;CF={n:"",t:"",pay:"Cash",paid:"",dc:""};
try{const d=await getDoc(doc(db,"users",c.owner,"pub",c.shop));if(d.exists()){CAT=d.data().items||[];if(d.data().shop)S.shop=d.data().shop;localStorage.setItem("dkcat_"+U.uid,JSON.stringify(d.data()))}}catch(e){try{const d=JSON.parse(localStorage.getItem("dkcat_"+U.uid));if(d){CAT=d.items||[];if(d.shop)S.shop=d.shop}}catch(_){}}
